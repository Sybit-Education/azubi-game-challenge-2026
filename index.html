<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SybitKart</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet" />
  </head>
  <!-- Body -->
  <body style="margin: 0">
    <main id="accessible-ui" class="accessible-layer">
      <h1 class="sr-only">Sybit Kart</h1>
      <button id="start-game" type="button">play</button>
      <button id="settings-btn" type="button">Settings</button>
      <button id="tutorial-btn" type="button" lang="de">Anleitung</button>
    </main>

    <section id="start-ui" class="accessible-layer" hidden>
      <button id="skip-intro" type="button">Skip Intro!</button>
    </section>

    <section id="game-over-ui" class="accessible-layer" hidden>
      <h2 class="sr-only">game over</h2>

      <p class="sr-only">Score: <span id="final-score"></span> Pts</p>
      <p class="sr-only">Distance: <span id="final-distance"></span> Km</p>

      <button id="retry" type="button">retry</button>
      <button id="back-to-home" type="button">mainMenu</button>
    </section>

    <section id="settings-section">
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <h2 id="settings-title" class="sr-only">Settings</h2>

        <label class="sr-only" for="accessible-toggle">accessibility mode</label>
        <input id="accessible-toggle" type="checkbox" />

        <label class="sr-only" for="game-mode-menu">game mode</label>
        <select id="game-mode-menu">
          <option value="standard">standard</option>
          <option value="christmas">Christmas mode</option>
        </select>
        <p class="sr-only">press escape to close the settings dialog.</p>
        <button id="close-settings" type="button" autofocus>Close</button>
      </dialog>
    </section>

    <dialog
      id="tutorial-dialog"
      lang="de"
      aria-labelledby="tutorial-title"
      aria-describedby="tutorial-description"
    >
      <div id="tutorial-highlight" aria-hidden="true" hidden></div>
      <section class="tutorial-panel">
        <div class="tutorial-header">
          <p id="tutorial-progress"></p>
          <button id="tutorial-close" type="button" aria-label="Tutorial schließen">
            Schließen <span aria-hidden="true">×</span>
          </button>
        </div>
        <progress
          id="tutorial-progress-bar"
          aria-label="Tutorial-Fortschritt"
          value="1"
          max="8"
        ></progress>
        <div class="tutorial-content">
          <h2
            id="tutorial-title"
            tabindex="-1"
            aria-describedby="tutorial-progress tutorial-description tutorial-location"
            autofocus
          ></h2>
          <p id="tutorial-description"></p>
          <p id="tutorial-location" class="tutorial-location"></p>
          <div id="tutorial-practice" hidden>
            <p id="tutorial-practice-help">W/A/S/D, Pfeiltasten oder diese Buttons:</p>
            <div
              class="tutorial-controls"
              role="group"
              aria-label="Übungssteuerung"
              aria-describedby="tutorial-practice-help"
            >
              <button type="button" data-direction="up" aria-label="Nach vorne fahren">
                <span aria-hidden="true">↑</span> W
              </button>
              <button type="button" data-direction="left" aria-label="Nach links lenken">
                <span aria-hidden="true">←</span> A
              </button>
              <button type="button" data-direction="down" aria-label="Nach hinten fahren">
                <span aria-hidden="true">↓</span> S
              </button>
              <button type="button" data-direction="right" aria-label="Nach rechts lenken">
                <span aria-hidden="true">→</span> D
              </button>
            </div>
          </div>
          <p id="tutorial-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
        <nav class="tutorial-navigation" aria-label="Tutorial-Schritte">
          <button id="tutorial-back" type="button">Zurück</button>
          <button id="tutorial-next" type="button">Weiter</button>
        </nav>
        <p class="tutorial-hint">Tab: Buttons auswählen · Enter: bestätigen · Esc: schließen</p>
      </section>
    </dialog>

    <!-- Start script -->
    <script type="module" src="src/main.js"></script>
  </body>
  <!-- Style -->
  <style>
    canvas {
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .accessible-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .accessible-layer button,
    #settings-dialog button,
    #settings-dialog input,
    #settings-dialog select {
      position: fixed;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: transparent;
      appearance: none;
      pointer-events: none;
      font-size: 0;
    }

    .accessible-layer button:focus-visible,
    #settings-dialog button:focus-visible,
    #settings-dialog input:focus-visible,
    #settings-dialog select:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px #ffffff;
    }

    #settings-dialog {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    #settings-dialog::backdrop {
      background: transparent;
      pointer-events: none;
    }

    #settings-dialog select option {
      color: #000000;
      background: #ffffff;
      font-size: 16px;
    }
  </style>
</html>
