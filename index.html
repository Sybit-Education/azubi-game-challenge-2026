<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SybitKart</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- Body -->
  <body style="margin: 0">
    <div id="game-status" class="sr-only" role="status" aria-atomic="true"></div>

    <main id="accessible-ui" class="accessible-layer">
      <h1 class="sr-only">Sybit Kart</h1>
      <button id="start-game" type="button">play</button>
      <button id="multiplayer-btn" type="button">multiplayer</button>
      <button id="settings-btn" type="button">Settings</button>
      <button id="how-to-play" type="button">How to play</button>
      <button id="leaderboard-btn" type="button">Leaderboard</button>
      <button id="credit-btn" type="button">credits</button>
    </main>

    <script type="importmap">
      {
        "imports": {
          "phaser": "./node_modules/phaser/dist/phaser.esm.js"
        }
      }
    </script>

    <section id="start-ui" class="accessible-layer" hidden>
      <button id="skip-intro" type="button">Skip Intro!</button>
    </section>

    <section id="credits-ui" class="sr-only" hidden>
      <h2>Credits</h2>
      <div id="credits-content"></div>
      <p>Press Eskape to skip</p>
    </section>

    <section id="game-over-ui" class="accessible-layer" hidden>
      <div id="game-over-result">
        <h2 class="sr-only">game over</h2>

        <p class="sr-only">Score: <span id="final-score"></span> Pts</p>
        <p class="sr-only">Distance: <span id="final-distance"></span> Km</p>
      </div>

      <button id="retry" type="button" aria-describedby="game-over-result">retry</button>
      <button id="back-to-home" type="button">mainMenu</button>
    </section>

    <section
      id="leaderboard-ui"
      class="accessible-layer"
      hidden
      aria-labelledby="leaderboard-title"
    >
      <h2 id="leaderboard-title" class="sr-only" tabindex="-1">Leaderboard</h2>
      <table class="sr-only">
        <caption>
          Top 10 distances
        </caption>
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Player</th>
            <th scope="col">Distance</th>
            <th scope="col">Blind</th>
          </tr>
        </thead>
        <tbody id="leaderboard-entries"></tbody>
      </table>
      <button id="leaderboard-home" type="button">Main menu</button>
    </section>

    <section id="settings-section">
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <h2 id="settings-title" class="sr-only">Settings</h2>

        <label class="sr-only" for="accessible-toggle">accessibility mode</label>
        <input id="accessible-toggle" type="checkbox" />

        <label class="sr-only" for="game-mode-menu">game mode</label>
        <button
          id="game-mode-menu"
          type="button"
          aria-expanded="false"
          aria-controls="christmas-mode-choice"
        >
          game mode
        </button>
        <button
          id="christmas-mode-choice"
          type="button"
          aria-label="Christmas mode"
          hidden
          disabled
        >
          Christmas mode
        </button>
        <p class="sr-only">press escape to close the settings dialog.</p>
        <button id="close-settings" type="button" autofocus>Close</button>
      </dialog>
    </section>

    <!-- How to play: guided practice drive. Visible panel, not an invisible overlay. -->
    <section id="how-to-play-ui" aria-labelledby="how-to-play-title" hidden>
      <p id="how-to-play-progress" class="htp-progress"></p>
      <h2 id="how-to-play-title" tabindex="-1"></h2>
      <p id="how-to-play-text"></p>
      <div
        id="how-to-play-sounds"
        class="htp-sounds"
        role="group"
        aria-label="Sound examples"
        hidden
      >
        <p class="htp-hint">Press a button to hear the sound.</p>
        <div id="how-to-play-sound-list" class="htp-row"></div>
      </div>
      <div class="htp-row">
        <button id="how-to-play-back" type="button" class="htp-secondary">Back</button>
        <button id="how-to-play-next" type="button" class="htp-primary">Next</button>
        <button id="how-to-play-repeat" type="button" class="htp-primary" hidden>
          Repeat practice
        </button>
        <button id="how-to-play-exit" type="button" class="htp-exit">Main menu</button>
      </div>
      <p class="htp-hint">Press Escape at any time to return to the main menu.</p>
    </section>

    <!-- Start script -->
    <script type="module" src="src/main.js"></script>
    <script>
      const playButton = document.getElementById('start-game');
      let keyboardModeEnabled = false;

      document.addEventListener(
        'keydown',
        (event) => {
          // Detect first Tab key press
          if (event.key === 'Tab' && !keyboardModeEnabled) {
            event.preventDefault();

            keyboardModeEnabled = true;
            document.body.classList.add('keyboard-navigation');

            playButton.focus();
          }
        },
        true,
      );

      // Detect any mouse click or touch event and disable keyboard navigation
      document.addEventListener('pointerdown', () => {
        keyboardModeEnabled = false;
        document.body.classList.remove('keyboard-navigation');
      });
    </script>
  </body>
  <!-- Style -->
  <style>
    @font-face {
      font-family: 'Silkscreen';
      src: url(assets/fonts/Silkscreen-Regular.ttf);
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    canvas {
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .accessible-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .accessible-layer button,
    #settings-dialog button,
    #settings-dialog input,
    #settings-dialog select {
      position: fixed;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: transparent;
      appearance: none;
      pointer-events: none;
      font-size: 0;
    }

    /* Modal dialogs make the canvas inert; their HTML controls handle clicks. */
    #settings-dialog button,
    #settings-dialog input,
    #settings-dialog select {
      pointer-events: auto;
    }

    #game-mode-menu,
    #christmas-mode-choice,
    #accessible-toggle,
    #close-settings {
      cursor: pointer;
    }

    .accessible-layer button,
    #settings-dialog button,
    #settings-dialog input,
    #settings-dialog select {
      outline: none;
      box-shadow: none;
    }

    body.keyboard-navigation .accessible-layer button:focus-visible,
    body.keyboard-navigation #settings-dialog button:focus-visible,
    body.keyboard-navigation #settings-dialog input:focus-visible,
    body.keyboard-navigation #settings-dialog select:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px #000000;
    }

    #settings-dialog {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    #settings-dialog::backdrop {
      background: transparent;
      pointer-events: none;
    }

    /* How to play panel. Change the colours here only. */
    #how-to-play-ui {
      --htp-primary: #c7e29e; /* main buttons */
      --htp-primary-text: #14210f;
      --htp-panel: #14210f;
      --htp-text: #f4f9ec;
      --htp-secondary: #2f4a22; /* Back and sound buttons */
      --htp-exit: #f3c9b8; /* Main menu button */
      --htp-exit-text: #3a1608;

      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      box-sizing: border-box;
      width: min(26rem, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      padding: 1rem;
      border: 3px solid var(--htp-primary);
      border-radius: 8px;
      background: var(--htp-panel);
      color: var(--htp-text);
      font-family: system-ui, sans-serif;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    #how-to-play-ui[hidden] {
      display: none;
    }

    #how-to-play-ui h2 {
      margin: 0 0 0.5rem;
      font-family: Silkscreen, system-ui, sans-serif;
      font-size: 1.3rem;
      outline: none;
    }

    #how-to-play-ui p {
      margin: 0 0 0.75rem;
    }

    #how-to-play-ui .htp-progress,
    #how-to-play-ui .htp-hint {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .htp-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    #how-to-play-ui button {
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border: 2px solid var(--htp-primary);
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #how-to-play-ui button[hidden] {
      display: none;
    }

    #how-to-play-ui button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #how-to-play-ui .htp-primary {
      background: var(--htp-primary);
      color: var(--htp-primary-text);
    }

    #how-to-play-ui .htp-secondary,
    #how-to-play-ui .htp-sounds button {
      background: var(--htp-secondary);
      color: var(--htp-text);
    }

    #how-to-play-ui .htp-exit {
      margin-left: auto;
      border-color: var(--htp-exit);
      background: var(--htp-exit);
      color: var(--htp-exit-text);
    }

    #how-to-play-ui button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
      box-shadow: 0 0 0 6px #000000;
    }
  </style>
</html>
